# Ambiente completo: PostgreSQL + API, em modo Production (como num servidor).
#   cp .env.example .env    # e preencher os segredos (o .env não entra no Git)
#   docker compose up --build
# A API fica em http://localhost:5281. As portas só se abrem neste computador (127.0.0.1); num servidor, a API fica
# atrás de um proxy com HTTPS (ver CLAUDE.md, "Produção") e o PostgreSQL nunca fica exposto.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: kubico
      POSTGRES_USER: kubico
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD no .env}
    # Só para ver a base com um cliente local; tira esta linha num servidor.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kubico-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubico -d kubico"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Kubico: "Host=db;Port=5432;Database=kubico;Username=kubico;Password=${POSTGRES_PASSWORD}"
      Database__MigrateOnStartup: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Falta JWT_SIGNING_KEY no .env}
      DataProtection__MasterKey: ${DATA_PROTECTION_MASTER_KEY:?Falta DATA_PROTECTION_MASTER_KEY no .env}
      PublicBaseUrl: ${PUBLIC_BASE_URL:-http://localhost:5281}
      Cors__AllowedOrigins__0: ${APP_ORIGIN:-http://localhost:8080}
      # Sem HTTPS neste ambiente local; num servidor, o proxy trata do HTTPS e isto fica a true.
      Https__Enforce: ${HTTPS_ENFORCE:-false}
    ports:
      - "127.0.0.1:5281:8080"
    # A imagem não tem curl: o bash fala HTTP com o próprio processo. "Vivo" chega (a base tem o seu healthcheck).
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf "GET /health/live HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && grep -q "200 OK" <&3'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Cópia de segurança da base, uma vez por dia, em ./backups (fora do Git); guardam-se 14 dias. Para repor:
  #   docker compose exec -T db pg_restore -U kubico -d kubico --clean --if-exists < backups/kubico-AAAA-MM-DD.dump
  # A DataProtection:MasterKey (no .env) não vai na cópia: guarda-a noutro sítio, sem ela os segredos da 2FA e das
  # contas de calendário ligadas não se leem.
  backup:
    image: postgres:17
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - >-
        while true; do
        pg_dump -h db -U kubico -Fc kubico > /backups/kubico-$$(date +%F).dump.tmp &&
        mv /backups/kubico-$$(date +%F).dump.tmp /backups/kubico-$$(date +%F).dump &&
        find /backups -name 'kubico-*.dump' -mtime +14 -delete;
        sleep 86400;
        done

volumes:
  kubico-db:
